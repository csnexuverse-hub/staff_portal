    async function handleLeaveApproval(leaveId, status, reason = '') {
      const index = allData.findIndex(d => (d.__backendId === leaveId || d._id === leaveId));
      const prevStatus = index !== -1 ? allData[index].leaveStatus : 'pending';
      const prevReason = index !== -1 ? allData[index].rejectionReason : '';

      // Instant optimistic UI update
      if (index !== -1) {
        allData[index].leaveStatus = status;
        if (reason) allData[index].rejectionReason = reason;
        renderCurrentPage();
      }
      showNotification(`Leave request ${status.toLowerCase()} successfully!`, 'success');

      try {
        const res = await apiFetch(`${API_BASE}/attendance/leave/${leaveId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify({ status: status.toLowerCase(), reason })
        });

        if (!res.ok) {
          if (index !== -1) {
            allData[index].leaveStatus = prevStatus;
            allData[index].rejectionReason = prevReason;
            renderCurrentPage();
          }
          showNotification('Failed to update leave request on server', 'error');
        }
      } catch (err) {
        if (index !== -1) {
          allData[index].leaveStatus = prevStatus;
          allData[index].rejectionReason = prevReason;
          renderCurrentPage();
        }
        showNotification('Error updating leave request', 'error');
      }
    }

    async function handleToolToggle(toolName, activate) {
      const currentUsage = allData.filter(d =>
        d.type === 'aiToolUsage' &&
        d.toolName === toolName &&
        d.isActive
      );

      if (activate) {
        if (allData.filter(d => d.type === 'aiToolUsage').length >= 999) {
          showNotification('Maximum tool usage records reached.', 'error');
          return;
        }

        if (currentUsage.length >= 2) {
          const oldestUser = currentUsage.sort((a, b) =>
            new Date(a.activatedAt) - new Date(b.activatedAt)
          )[0];

          const revokedUsage = {
            ...oldestUser,
            isActive: false
          };

          await window.dataSdk.update(revokedUsage);

          await window.dataSdk.create({
            type: 'aiToolAudit',
            userId: oldestUser.userId,
            username: oldestUser.username,
            toolName,
            activityType: 'revoked',
            activityDescription: `Session automatically revoked due to seat limit.You were logged out of ${toolName} because the seat limit was reached.`,
            timestamp: new Date().toISOString()
          });

          showNotification(`Oldest user session for ${escapeHtml(toolName)} was automatically revoked`, 'warning');
        }

        const result = await window.dataSdk.create({
          type: 'aiToolUsage',
          userId: currentUser.userId,
          username: currentUser.username,
          toolName,
          isActive: true,
          activatedAt: new Date().toISOString()
        });

        if (result.isOk) {
          await window.dataSdk.create({
            type: 'aiToolAudit',
            userId: currentUser.userId,
            username: currentUser.username,
            toolName,
            activityType: 'activated',
            activityDescription: `Activated ${toolName} `,
            timestamp: new Date().toISOString()
          });

          showNotification(`${escapeHtml(toolName)} activated successfully!`, 'success');
        } else {
          showNotification('Failed to activate tool', 'error');
        }
      } else {
        const myUsage = currentUsage.find(u => u.userId === currentUser.userId);
        if (!myUsage) return;

        const updated = {
          ...myUsage,
          isActive: false
        };

    async function handleSubtaskToggle(workItemId, subtask) {
      const workItem = allData.find(d => d.__backendId === workItemId);
      if (!workItem) return;

      let subtasks = [];
      let completedSubtasks = [];
      try {
        subtasks = JSON.parse(workItem.subtasks || '[]');
        completedSubtasks = JSON.parse(workItem.completedSubtasks || '[]');
      } catch (e) { }

      const isCompleted = completedSubtasks.includes(subtask);

      if (isCompleted) {
        completedSubtasks = completedSubtasks.filter(t => t !== subtask);
      } else {
        completedSubtasks.push(subtask);
      }

      const progress = subtasks.length > 0
        ? Math.round((completedSubtasks.length / subtasks.length) * 100)
        : 0;

      const updated = {
        ...workItem,
        completedSubtasks: JSON.stringify(completedSubtasks),
        progress
      };

      const result = await window.dataSdk.update(updated);

      if (result.isOk) {
        await window.dataSdk.create({
          type: 'activity',
          workItemId: workItem.workItemId,
          activityType: 'subtask_updated',
          activityDescription: `Subtask "${subtask}" ${isCompleted ? 'unchecked' : 'completed'} by ${currentUser.username} `,
          timestamp: new Date().toISOString(),
          userId: currentUser.userId,
          username: currentUser.username
        });

        document.querySelector('.modal-backdrop')?.remove();
        viewWorkItem(workItemId);
      }
    }

    function exportToCSV() {
      const workItems = allData.filter(d => d.type === 'workItem');
      const attendance = allData.filter(d => d.type === 'attendance');

      let csv = 'Type,Title/Employee,Status/Department,Date,Details\n';

      workItems.forEach(item => {
        csv += `Work Item, "${item.title}", "${item.status}", "${item.deadline}", "${item.description}"\n`;
      });

      attendance.forEach(record => {
        csv += `Attendance, "${record.username}", "${record.checkOutTime ? 'Completed' : 'In Progress'}", "${record.checkInTime}", "${record.checkOutTime || '-'}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'staff-portal-report.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function showNotification(message, type = 'info') {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'fixed top-4 right-4 z-50 flex flex-col gap-2.5 max-w-sm pointer-events-none';
        document.body.appendChild(container);
      }

      const toast = document.createElement('div');
      toast.className = `p-4 rounded-xl shadow-lg border pointer-events-auto flex items-start gap-3 transition-all duration-300 transform translate-y-0 opacity-100 ${
        type === 'success' ? 'bg-emerald-50 border-emerald-300 text-emerald-900' :
        type === 'error' ? 'bg-rose-50 border-rose-300 text-rose-900' :
        type === 'info' ? 'bg-blue-50 border-blue-300 text-blue-900' :
        'bg-amber-50 border-amber-300 text-amber-900'
      }`;

      const icon = type === 'success' ? '✓' : (type === 'error' ? '✕' : (type === 'info' ? '📢' : '🔔'));
      toast.innerHTML = `
        <div class="text-base leading-none mt-0.5">${icon}</div>
        <div class="flex-1 text-xs leading-snug">${message}</div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 text-sm font-bold leading-none">&times;</button>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 5000);
    }

      const startDate = document.getElementById('work-start-date')?.value;
      const endDate = document.getElementById('work-end-date')?.value;

      const { currentAdminId, members, adminSelf } = getAdminTeamUsers();
      let targetUsers = [];
      if (memberId === 'all') {
        targetUsers = [...members];
        if (adminSelf) targetUsers.push(adminSelf);
      } else if (memberId === currentAdminId) {
        targetUsers = adminSelf ? [adminSelf] : [];
      } else {
        targetUsers = members.filter(m => String(m.userId || m._id || m.id) === memberId);
      }

      const targetUserIds = new Set(targetUsers.map(u => String(u.userId || u._id || u.id)));

      const start = startDate ? new Date(startDate) : new Date(2020, 0, 1);
      const end = endDate ? new Date(endDate) : new Date();
      end.setHours(23, 59, 59, 999);

      const workItems = allData.filter(d => {
        if (d.type !== 'workItem') return false;

        // Date filter
        if (d.createdAt) {
          const dt = new Date(d.createdAt);
          if (dt < start || dt > end) return false;
        }

        // Status filter
        if (statusFilter !== 'all') {
          const s = (d.status || '').toLowerCase();
          if (statusFilter === 'completed' && s !== 'completed') return false;
          if (statusFilter === 'in progress' && s !== 'in progress' && s !== 'in_progress') return false;
          if (statusFilter === 'pending' && s !== 'pending' && s !== 'assigned') return false;
        }

        // Assignee match
        const assignedList = Array.isArray(d.assignedTo) ? d.assignedTo : (d.assignedTo ? [d.assignedTo] : []);
        return assignedList.some(a => targetUserIds.has(String(a._id || a.id || a.userId || a)));
      });

      return workItems.map(w => {
        const assignedList = Array.isArray(w.assignedTo) ? w.assignedTo : (w.assignedTo ? [w.assignedTo] : []);
        const assignedNames = assignedList.map(a => {
          const aid = String(a._id || a.id || a.userId || a);
          const u = allData.find(d => d.type === 'user' && String(d.userId || d._id || d.id) === aid);
          return u?.name || a.name || 'Staff';
        }).join(', ') || 'Unassigned';

        const assignedByName = (typeof w.assignedBy === 'object' && w.assignedBy)
          ? (w.assignedBy.name || 'Admin')
          : (allData.find(d => d.type === 'user' && String(d.userId || d._id || d.id) === String(w.assignedBy))?.name || 'Admin');

        return {
          'Assigned To': assignedNames,
          'Work Title': w.title || '-',
          'Description': w.description || '-',
          'Status': w.status || 'Pending',
          'Progress (%)': w.progress || 0,
          'Assigned By': assignedByName,
          'Created Date': w.createdAt ? new Date(w.createdAt).toLocaleDateString() : '-',
          'Deadline': w.deadline ? new Date(w.deadline).toLocaleDateString() : 'No deadline'

      });

      const endDate = endInput ? endInput.value : '';

      const start = startDate ? new Date(startDate) : new Date(2020, 0, 1);
      const end = endDate ? new Date(endDate) : new Date();

      const users = allData.filter(d => d.type === 'user');
      const userMap = new Map();
      users.forEach(u => userMap.set(String(u.userId || u._id || u.id), u));

      const workItems = allData.filter(d => {
        if (d.type !== 'workItem') return false;

        // Date filter
        if (d.createdAt) {
          const dt = new Date(d.createdAt);
          if (dt < start || dt > end) return false;
        }

        // Status filter
        if (selectedStatus !== 'all') {
          const s = (d.status || '').toLowerCase();
          if (selectedStatus === 'completed' && s !== 'completed') return false;
          if (selectedStatus === 'in progress' && s !== 'in progress' && s !== 'in_progress') return false;
          if (selectedStatus === 'pending' && s !== 'pending' && s !== 'assigned') return false;

        // Assigned users
        const assignedList = Array.isArray(d.assignedTo) ? d.assignedTo : (d.assignedTo ? [d.assignedTo] : []);

        if (selectedUserId !== 'all') {
          const matchesUser = assignedList.some(a => String(a._id || a.id || a.userId || a) === selectedUserId);
          if (!matchesUser) return false;
        }

        if (selectedRole !== 'all') {
          const matchesRole = assignedList.some(a => {
            const aid = String(a._id || a.id || a.userId || a);
            const u = userMap.get(aid) || (typeof a === 'object' ? a : null);
            const r = (u?.role || '').toLowerCase();
            return r === selectedRole;
          });
          if (!matchesRole && assignedList.length > 0) return false;
        }

        return true;

      return workItems.map(w => {
        const assignedList = Array.isArray(w.assignedTo) ? w.assignedTo : (w.assignedTo ? [w.assignedTo] : []);

          : (userMap.get(String(w.assignedBy))?.name || 'Super Admin');

          'Work Title': w.title || '-',
          'Description': w.description || '-',
          'Assigned To': assignedNames,
          'Role': assignedRoles,
          'Department': assignedDepts,
          'Assigned By': assignedByName,
          'Status': w.status || 'Pending',
          'Progress (%)': w.progress || 0,
          'Created Date': w.createdAt ? new Date(w.createdAt).toLocaleDateString() : '-',

      });

    function downloadExcel(data, filename) {
      // Export with .csv extension or UTF-8 BOM so Excel opens with proper encoding
      downloadCSV(data, filename.endsWith('.xlsx') ? filename.replace('.xlsx', '.csv') : filename);
    }

    function downloadCSV(data, filename) {
      if (!data || data.length === 0) {
        showNotification('No data to export', 'error');
        return;
      }

      const headers = Object.keys(data[0]);
      const csvContent = [
        headers.map(h => `"${String(h).replace(/"/g, '""')}"`).join(','),
        ...data.map(row => headers.map(header => {
          let val = row[header];
          val = (val !== undefined && val !== null ? String(val) : '');
          // CSV Formula Injection mitigation
          if (/^[=+\-@\t\r]/.test(val)) {
            val = "'" + val;
          }
          return `"${val.replace(/"/g, '""')}"`;
        }).join(','))
      ].join('\r\n');

      // Prepend UTF-8 BOM so Microsoft Excel correctly recognizes character set
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      showNotification('Report downloaded successfully!', 'success');
    }
