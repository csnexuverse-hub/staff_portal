    }

    window.calendarFilterPerson = window.calendarFilterPerson || '';
    window.calendarFilterStatus = window.calendarFilterStatus || '';
    window.calendarFilterPriority = window.calendarFilterPriority || '';
    window.calendarCurrentMonth = (typeof window.calendarCurrentMonth === 'number') ? window.calendarCurrentMonth : new Date().getMonth();
    window.calendarCurrentYear = (typeof window.calendarCurrentYear === 'number') ? window.calendarCurrentYear : new Date().getFullYear();

    window.handleCalendarFilterChange = function () {
      const personEl = document.getElementById('calendar-filter-person');
      const statusEl = document.getElementById('calendar-filter-status');
      const priorityEl = document.getElementById('calendar-filter-priority');
      if (personEl) window.calendarFilterPerson = personEl.value;
      if (statusEl) window.calendarFilterStatus = statusEl.value;
      if (priorityEl) window.calendarFilterPriority = priorityEl.value;
      renderCurrentCalendar();
    };

    window.resetCalendarFilters = function () {
      window.calendarFilterPerson = '';
      window.calendarFilterStatus = '';
      window.calendarFilterPriority = '';
      renderCurrentCalendar();
    };

    window.changeCalendarMonth = function (offset) {
      let m = window.calendarCurrentMonth + offset;
      let y = window.calendarCurrentYear;
      if (m < 0) {
        m = 11;
        y--;
      } else if (m > 11) {
        m = 0;
        y++;
      }
      window.calendarCurrentMonth = m;
      window.calendarCurrentYear = y;
      renderCurrentCalendar();
    };

    window.resetCalendarToday = function () {
      window.calendarCurrentMonth = new Date().getMonth();
      window.calendarCurrentYear = new Date().getFullYear();
      renderCurrentCalendar();
    };

    function renderCurrentCalendar() {
      const mainContent = document.getElementById('main-content');
      if (mainContent) {
        const config = window.elementSdk?.config || defaultConfig;
        mainContent.innerHTML = renderPageContent(config);
        attachEventListeners();
      } else {
        renderCurrentPage();
      }
    }

    function renderCalendarPage(config) {
      const textColor = config.text_color || defaultConfig.text_color;
      const workItems = allData.filter(d => d.type === 'workItem');
      const users = allData.filter(d => d.type === 'user');
      const currentUserId = String(currentUser?.userId || currentUser?._id || currentUser?.id || '');

      // User color assignment
      const memberColors = {};
      const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-purple-500', 'bg-pink-500', 'bg-indigo-500', 'bg-rose-500', 'bg-teal-500'];
      users.forEach((user, index) => {
        memberColors[String(user.userId || user._id || user.id)] = colors[index % colors.length];
      });

      // 1. Role-based baseline filtering
      let relevantWork = workItems;
      if (currentUser?.role === 'member') {
        relevantWork = workItems.filter(w => {
          const assignees = Array.isArray(w.assignedTo) ? w.assignedTo : (w.assignedTo ? [w.assignedTo] : []);
          return assignees.some(a => String(a._id || a.id || a.userId || a) === currentUserId);
        });
      } else if (currentUser?.role === 'admin') {
        const teamMembers = allData.filter(d =>
          d.type === 'user' &&
          (String(d.assignedAdmin?._id || d.assignedAdmin || '') === currentUserId || (currentUser?.department && d.department === currentUser.department))
        );
        const allowedIds = new Set(teamMembers.map(m => String(m.userId || m._id || m.id)));
        allowedIds.add(currentUserId);
        relevantWork = workItems.filter(w => {
          const assignees = Array.isArray(w.assignedTo) ? w.assignedTo : (w.assignedTo ? [w.assignedTo] : []);
          return assignees.some(a => allowedIds.has(String(a._id || a.id || a.userId || a))) ||
            String(w.assignedBy?._id || w.assignedBy) === currentUserId;
        });
      }

      // 2. Dynamic UI Filters
      const selPerson = window.calendarFilterPerson || '';
      const selStatus = (window.calendarFilterStatus || '').toLowerCase();
      const selPriority = (window.calendarFilterPriority || '').toLowerCase();

      const filteredWorkItems = relevantWork.filter(w => {
        // Person filter
        if (selPerson) {
          const assignees = Array.isArray(w.assignedTo) ? w.assignedTo : (w.assignedTo ? [w.assignedTo] : []);
          const matchesPerson = assignees.some(a => String(a._id || a.id || a.userId || a) === selPerson);
          if (!matchesPerson) return false;
        }

        // Status filter
        if (selStatus) {
          const s = (w.status || '').toLowerCase();
          if (selStatus === 'in_progress') {
            if (s !== 'in_progress' && s !== 'in progress') return false;
          } else {
            if (s !== selStatus) return false;
          }
        }

        // Priority filter
        if (selPriority) {
          const p = (w.priority || '').toLowerCase();
          if (p !== selPriority) return false;
        }

        return true;
      });

      // 3. Calendar dates calculation
      const viewMonth = window.calendarCurrentMonth;
      const viewYear = window.calendarCurrentYear;
      const monthStart = new Date(viewYear, viewMonth, 1);
      const monthEnd = new Date(viewYear, viewMonth + 1, 0);

      const daysInMonth = monthEnd.getDate();
      const firstDayOfWeek = monthStart.getDay();

      const calendarDays = [];
      for (let i = 0; i < firstDayOfWeek; i++) {
        calendarDays.push(null);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        calendarDays.push(day);
      }

      // 4. Eligible people for person filter
      let filterPeople = [];
      if (currentUser?.role === 'superadmin') {
        filterPeople = users.filter(u => u.role !== 'superadmin');
      } else if (currentUser?.role === 'admin') {
        const teamMembers = allData.filter(d =>
          d.type === 'user' &&
          (String(d.assignedAdmin?._id || d.assignedAdmin || '') === currentUserId || (currentUser?.department && d.department === currentUser.department))
        );
        filterPeople = [...teamMembers];
        const adminSelf = users.find(u => String(u.userId || u._id || u.id) === currentUserId);
        if (adminSelf && !filterPeople.some(p => String(p.userId || p._id || p.id) === currentUserId)) {
          filterPeople.unshift(adminSelf);
        }
      }

      const isFilterActive = !!(selPerson || selStatus || selPriority);
      const monthName = new Date(viewYear, viewMonth, 1).toLocaleString('default', { month: 'long', year: 'numeric' });
      const now = new Date();
      const isCurrentMonth = now.getFullYear() === viewYear && now.getMonth() === viewMonth;

      return `
        <div class="space-y-6">
          <!-- Calendar Header & Filters -->
          <div class="flex flex-wrap justify-between items-center gap-4">
            <div>
              <h2 class="text-2xl font-bold" style="color: ${textColor};">Work Calendar</h2>
              <p class="text-xs text-gray-500">Track deadlines, task status, and member commitments</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
              ${(currentUser?.role === 'admin' || currentUser?.role === 'superadmin') ? `
              <select id="calendar-filter-person" onchange="handleCalendarFilterChange()" class="input-field text-xs py-1.5">
                <option value="">All People</option>
                ${filterPeople.map(u => {
        const uid = String(u.userId || u._id || u.id);
        return `<option value="${uid}" ${selPerson === uid ? 'selected' : ''}>${escapeHtml(u.name)} (${(u.role || '').toUpperCase()})</option>`;
      }).join('')}
              </select>
              ` : ''}

              <select id="calendar-filter-status" onchange="handleCalendarFilterChange()" class="input-field text-xs py-1.5">
                <option value="" ${selStatus === '' ? 'selected' : ''}>All Status</option>
                <option value="assigned" ${selStatus === 'assigned' ? 'selected' : ''}>Assigned</option>
                <option value="accepted" ${selStatus === 'accepted' ? 'selected' : ''}>Accepted</option>
                <option value="in_progress" ${selStatus === 'in_progress' ? 'selected' : ''}>In Progress</option>
                <option value="completed" ${selStatus === 'completed' ? 'selected' : ''}>Completed</option>
                <option value="confirmed" ${selStatus === 'confirmed' ? 'selected' : ''}>Confirmed</option>
              </select>

              <select id="calendar-filter-priority" onchange="handleCalendarFilterChange()" class="input-field text-xs py-1.5">
                <option value="" ${selPriority === '' ? 'selected' : ''}>All Priority</option>
                <option value="High" ${selPriority === 'high' ? 'selected' : ''}>High Priority</option>
                <option value="Medium" ${selPriority === 'medium' ? 'selected' : ''}>Medium Priority</option>
                <option value="Low" ${selPriority === 'low' ? 'selected' : ''}>Low Priority</option>
              </select>

              ${isFilterActive ? `
                <button onclick="resetCalendarFilters()" class="text-xs text-rose-600 hover:text-rose-700 bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg font-semibold transition">
                  Clear Filters
                </button>
              ` : ''}
            </div>
          </div>
          
          <div class="card p-6">
            <!-- Month Navigation Bar -->
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
              <div class="flex items-center gap-2">
                <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-lg border border-gray-200 hover:bg-gray-100 text-gray-600 transition" title="Previous Month">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h3 class="text-xl font-bold min-w-[180px] text-center" style="color: ${textColor};">
                  ${monthName}
                </h3>
                <button onclick="changeCalendarMonth(1)" class="p-2 rounded-lg border border-gray-200 hover:bg-gray-100 text-gray-600 transition" title="Next Month">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
              </div>

              <div class="flex items-center gap-3">
                ${!isCurrentMonth ? `
                  <button onclick="resetCalendarToday()" class="text-xs text-indigo-600 hover:text-indigo-700 bg-indigo-50 border border-indigo-200 px-3 py-1.5 rounded-lg font-semibold transition">
                    Go to Today
                  </button>
                ` : ''}
                <div class="text-xs text-gray-500">
                  <span class="font-bold text-slate-800">${filteredWorkItems.length}</span> tasks in view
                </div>
              </div>
            </div>
            
            <div class="overflow-x-auto">
              <div class="grid grid-cols-7 gap-2 min-w-[700px]">
                ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => `
                  <div class="text-center font-bold text-xs py-2 uppercase tracking-wider text-gray-500 bg-gray-50/80 rounded-md">${day}</div>
                `).join('')}
                
                ${calendarDays.map(day => {
        if (!day) return '<div class="min-h-[100px] bg-gray-50/30 rounded-lg"></div>';

        const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = isCurrentMonth && day === now.getDate();

        const dayTasks = filteredWorkItems.filter(w => {
          if (!w.deadline) return false;
          const d = new Date(w.deadline);
          if (isNaN(d.getTime())) return false;
          return d.getFullYear() === viewYear && d.getMonth() === viewMonth && d.getDate() === day;
        });

        const hasTasks = dayTasks.length > 0;

        return `
                    <div class="min-h-[105px] border rounded-xl p-2 transition flex flex-col justify-between ${isToday ? 'ring-2 ring-indigo-500 bg-indigo-50/20' : 'border-gray-200'} ${hasTasks ? 'hover:shadow-md hover:border-indigo-300 cursor-pointer bg-white' : 'bg-white/60'}" 
                         onclick="${hasTasks ? `showWorkDetails('${dateStr}')` : ''}">
                      <div class="flex justify-between items-start mb-1">
                        <span class="text-xs font-bold ${isToday ? 'text-indigo-600 bg-indigo-100 px-1.5 py-0.5 rounded-full' : 'text-slate-700'}">${day}</span>
                        ${hasTasks ? `<span class="text-[10px] font-bold px-1.5 py-0.2 rounded-full bg-slate-100 text-slate-600">${dayTasks.length}</span>` : ''}
                      </div>

                      <div class="space-y-1 flex-1 overflow-hidden">
                        ${dayTasks.slice(0, 2).map(t => {
          const priorityClass = (t.priority || 'medium').toLowerCase();
          const priorityBadge = priorityClass === 'high' ? 'bg-red-100 text-red-700 border-red-200' : (priorityClass === 'low' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-amber-100 text-amber-700 border-amber-200');
          const title = t.title || 'Untitled Task';
          return `
                            <div class="text-[11px] px-1.5 py-0.5 rounded border truncate font-medium ${priorityBadge}" title="${escapeHtml(title)} (${t.status || 'Assigned'})">
                              ${escapeHtml(title)}
                            </div>
                          `;
        }).join('')}
                        ${dayTasks.length > 2 ? `
                          <div class="text-[10px] font-semibold text-indigo-600 text-center">+${dayTasks.length - 2} more</div>
                        ` : ''}
                      </div>
                    </div>
                  `;
      }).join('')}
              </div>
            </div>
          </div>
          
          ${(currentUser?.role === 'admin' || currentUser?.role === 'superadmin') ? `
          <div class="card p-4">
            <h4 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Department Legend & Member Identifiers</h4>
            <div class="flex flex-wrap gap-3">
              ${filterPeople.map(u => {
        const uid = String(u.userId || u._id || u.id);
        const color = memberColors[uid] || 'bg-gray-400';
        return `
                  <div class="flex items-center gap-1.5 text-xs text-slate-700 font-medium">
                    <div class="w-2.5 h-2.5 rounded-full ${color}"></div>
                    <span>${escapeHtml(u.name)}</span>
                    <span class="text-[10px] text-gray-400">(${escapeHtml(u.department || u.role)})</span>
                  </div>
                `;
      }).join('')}
            </div>
          </div>
          ` : ''}
        </div>
      `;
    }

    function renderAttendancePage(config) {
      if (currentUser?.role === 'superadmin') {
        return renderSuperAdminAttendance(config);
      }

      const textColor = config.text_color || defaultConfig.text_color;
      const today = new Date().toISOString().split('T')[0];

      if (currentUser?.role === 'admin') {
        const currentAdminId = String(currentUser?.userId || currentUser?._id || currentUser?.id || '');
        const teamMembers = allData.filter(d =>
          d.type === 'user' &&
          d.role === 'member' &&
          (String(d.assignedAdmin?._id || d.assignedAdmin || '') === currentAdminId || (currentUser?.department && d.department === currentUser.department))
        );
        const teamMemberIds = new Set(teamMembers.map(m => String(m.userId || m._id || m.id)));

        const teamAttendance = allData.filter(d => {
          if (d.type !== 'attendance') return false;
          const attUserId = String(d.userId || d.user?._id || d.user || '');
          return teamMemberIds.has(attUserId);
        });

        const teamLeaveRequests = allData.filter(d => {
          if (d.type !== 'leaveRequest') return false;
          const lUserId = String(d.userId || d.user?._id || d.user || '');
          return teamMemberIds.has(lUserId);
        });

        const myLeaveRequests = allData.filter(d => d.type === 'leaveRequest' && String(d.userId || d.user?._id || d.user) === currentAdminId);

        const adminAttendance = allData.filter(d =>
          d.type === 'attendance' && String(d.userId || d.user?._id || d.user) === currentAdminId
        );
        const todayAdminAttendance = adminAttendance.find(a => {
          const dt = a.checkInTime || a.checkIn || a.date;
          return dt && new Date(dt).toISOString().split('T')[0] === today;
        });

        return `
          <div class="space-y-6">
            <h2 class="text-2xl font-bold" style="color: ${textColor};">Attendance Management</h2>
            
            <!-- Admin Check In / Out -->
            <div class="card p-6">
              <h3 class="text-lg font-bold mb-4" style="color: ${textColor};">My Today's Attendance</h3>
              <div class="flex gap-4">
                ${!todayAdminAttendance ? `
                  <button onclick="handleCheckIn()" class="btn-success text-white px-6 py-3 rounded-lg font-semibold">
                    Check In
                  </button>
                ` : !todayAdminAttendance.checkOutTime ? `
                  <div class="flex items-center gap-4">
                    <div>
                      <div class="text-sm text-gray-600">Checked in at:</div>
                      <div class="font-semibold" style="color: ${textColor};">${new Date(todayAdminAttendance.checkInTime).toLocaleTimeString()}</div>
                    </div>
                    <button onclick="handleCheckOut('${todayAdminAttendance.__backendId}')" class="btn-warning text-white px-6 py-3 rounded-lg font-semibold">
                      Check Out
                    </button>
                  </div>
                ` : `
                  <div class="flex items-center gap-6">
                    <div>
                      <div class="text-sm text-gray-600">Checked in:</div>
                      <div class="font-semibold" style="color: ${textColor};">${new Date(todayAdminAttendance.checkInTime).toLocaleTimeString()}</div>
                    </div>
                    <div>
                      <div class="text-sm text-gray-600">Checked out:</div>
                      <div class="font-semibold" style="color: ${textColor};">${new Date(todayAdminAttendance.checkOutTime).toLocaleTimeString()}</div>
                    </div>
                    <span class="badge badge-completed">Completed</span>
                  </div>
                `}
              </div>
            </div>
            
            <!-- Admin Leave Request -->
            <div class="card p-6">
              <h3 class="text-lg font-bold mb-4" style="color: ${textColor};">Request Leave (Sent to Super Admin)</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-sm font-semibold mb-2" style="color: ${textColor};">Leave Type</label>
                  <select id="leave-type" class="input-field w-full">
                    <option value="">Select Type</option>
                    <option value="Sick Leave">Sick Leave</option>
                    <option value="Casual Leave">Casual Leave</option>
                    <option value="Vacation">Vacation</option>
                    <option value="Personal">Personal</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-semibold mb-2" style="color: ${textColor};">Start Date</label>
                  <input type="date" id="leave-start" class="input-field w-full">
                </div>
                <div>
                  <label class="block text-sm font-semibold mb-2" style="color: ${textColor};">End Date</label>
                  <input type="date" id="leave-end" class="input-field w-full">
                </div>
              </div>
              <div class="mt-4">
                <label class="block text-sm font-semibold mb-2" style="color: ${textColor};">Reason</label>
                <textarea id="leave-reason" class="input-field w-full" rows="3" placeholder="Enter reason for leave"></textarea>
              </div>
              <button onclick="handleLeaveRequest()" class="btn-primary text-white px-6 py-3 rounded-lg font-semibold mt-4">
                Submit Leave Request to Super Admin
              </button>
            </div>
            
            <!-- Team Attendance -->
            <div class="card p-6">
              <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
                <div>
                  <h3 class="text-lg font-bold" style="color: ${textColor};">Team Attendance Records</h3>
                  <p class="text-xs text-gray-500">Showing attendance for members in your department</p>
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="downloadAttendanceReportCSV()" class="btn-primary text-white text-xs px-3.5 py-1.5 rounded-lg font-semibold shadow-xs flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Download CSV
                  </button>
                </div>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full">
                  <thead>
                    <tr class="border-b">
                      <th class="text-left py-3 px-4">Employee</th>
                      <th class="text-left py-3 px-4">Date</th>
                      <th class="text-left py-3 px-4">Check In</th>
                      <th class="text-left py-3 px-4">Check Out</th>
                      <th class="text-left py-3 px-4">Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${teamAttendance
            .sort((a, b) => new Date(b.checkInTime || b.checkIn || b.date || 0) - new Date(a.checkInTime || a.checkIn || a.date || 0))
            .slice(0, 50)
            .map(a => {
              const empId = String(a.userId || a.user?._id || a.user || '');
              const empUser = allData.find(u => u.type === 'user' && String(u.userId || u._id || u.id) === empId);
              const empName = a.user?.name || a.username || empUser?.name || 'Member';
              const checkInDate = a.checkInTime || a.checkIn || a.date;
              const checkOutDate = a.checkOutTime || a.checkOut;
              return `
                        <tr class="border-b hover:bg-gray-50">
                          <td class="py-3 px-4">
                            <div class="font-semibold text-slate-800 text-sm">${escapeHtml(empName)}</div>
                            <div class="text-[11px] text-gray-500">${escapeHtml(empUser?.department || empUser?.email || '')}</div>
                          </td>
                          <td class="py-3 px-4 text-sm">${checkInDate ? new Date(checkInDate).toLocaleDateString() : '-'}</td>
                          <td class="py-3 px-4 text-sm">${checkInDate ? new Date(checkInDate).toLocaleTimeString() : '-'}</td>
                          <td class="py-3 px-4 text-sm">${checkOutDate ? new Date(checkOutDate).toLocaleTimeString() : '<span class="text-amber-600 font-medium">In Progress</span>'}</td>
                          <td class="py-3 px-4">
                            <span class="badge ${checkOutDate ? 'badge-completed' : 'badge-in-progress'}">
                              ${checkOutDate ? 'Complete' : 'In Progress'}
                            </span>
                          </td>
                        </tr>
                      `;
            }).join('') || '<tr><td colspan="5" class="py-8 text-center text-gray-500">No team attendance records found</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>
            
            <!-- Team Leave Requests -->
            <div class="card p-6">
              <h3 class="text-lg font-bold mb-4" style="color: ${textColor};">Team Leave Requests</h3>
              <div class="space-y-3">
                ${teamLeaveRequests.map(l => `
                  <div class="border rounded-lg p-4">
                    <div class="flex justify-between items-start mb-2">
                      <div>
                        <div class="font-semibold" style="color: ${textColor};">${escapeHtml(l.username)}</div>
                        <div class="text-sm text-gray-600">${escapeHtml(l.reason)}</div>
                      </div>
                      <span class="badge badge-${l.leaveStatus?.toLowerCase()}">${l.leaveStatus}</span>
                    </div>
                    <div class="text-sm text-gray-600">
                      ${new Date(l.startDate).toLocaleDateString()} to ${new Date(l.endDate).toLocaleDateString()}
                    </div>
                    ${l.leaveStatus?.toLowerCase() === 'pending' ? `
                      <div class="flex gap-2 mt-3">
                        <button onclick="handleLeaveAction('${l.__backendId}', 'Approved')" class="btn-success text-white px-4 py-2 rounded-lg text-sm font-semibold">
                          Approve
                        </button>
                        <button onclick="handleLeaveAction('${l.__backendId}', 'Rejected')" class="btn-warning text-white px-4 py-2 rounded-lg text-sm font-semibold">
                          Reject
                        </button>
                      </div>
                    ` : ''}
                  </div>
                `).join('') || '<p class="text-gray-600">No leave requests</p>'}
              </div>
            </div>
            
            <!-- My Leave Requests -->
            <div class="card p-6">
              <h3 class="text-lg font-bold mb-4" style="color: ${textColor};">My Leave Requests</h3>
              <div class="space-y-3">
                ${myLeaveRequests.map(l => `
                  <div class="border rounded-lg p-4">
                    <div class="flex justify-between items-start mb-2">
                      <div>
                        <div class="text-sm text-gray-600">${escapeHtml(l.reason)}</div>
                      </div>
                      <span class="badge badge-${l.leaveStatus?.toLowerCase()}">${l.leaveStatus}</span>
                    </div>
                    <div class="text-sm text-gray-600">
                      ${new Date(l.startDate).toLocaleDateString()} to ${new Date(l.endDate).toLocaleDateString()}
                    </div>
                    ${l.leaveStatus === 'rejected' && l.rejectionReason ? `<div class="text-sm text-red-600 mt-2">Rejection Reason: ${escapeHtml(l.rejectionReason)}</div>` : ''}
                  </div>
                `).join('') || '<p class="text-gray-600">No leave requests</p>'}
              </div>
            </div>
          </div>
        `;
      } else {
        // Member view
        const myAttendance = allData.filter(d =>
          d.type === 'attendance' && d.userId === currentUser.userId
        );
        const todayAttendance = myAttendance.find(a => a.checkInTime?.startsWith(today));

        const myLeaveRequests = allData.filter(d => d.type === 'leaveRequest' && d.userId === currentUser.userId);

        return `
          <div class="space-y-6">
            <h2 class="text-2xl font-bold" style="color: ${textColor};">Attendance Management</h2>
            
            <!--Check In / Out Card-->
            <div class="card p-6">
              <h3 class="text-lg font-bold mb-4" style="color: ${textColor};">Today's Attendance</h3>
              <div class="flex gap-4">
                ${!todayAttendance ? `
                  <button onclick="handleCheckIn()" class="btn-success text-white px-6 py-3 rounded-lg font-semibold">
                    Check In

    function handleMeetingLinkClick(event, link, dateTimeStr) {
      if (!dateTimeStr) return true;
      const meetingTime = new Date(dateTimeStr).getTime();
      const isExpired = Date.now() > meetingTime + (15 * 60 * 1000);
      if (isExpired) {
        if (event) event.preventDefault();
        showNotification('Meeting link has expired (valid for 15 minutes from meeting time)', 'error');
        renderCurrentPage();
        return false;
      }
      return true;
    }

    function formatCreator(m) {
      let name = m.createdByName || '';
      let role = m.createdByRole || '';

      const creatorId = (typeof m.createdBy === 'object' && m.createdBy) ? (m.createdBy._id || m.createdBy.id) : m.createdBy;

      if (typeof m.createdBy === 'object' && m.createdBy) {
        name = name || m.createdBy.name || '';
        role = role || m.createdBy.role || '';
      }

      // Check allData users (includes superadmin, admin, and member)
      if ((!name || !role) && creatorId) {
        const user = allData.find(d => d.type === 'user' && (d.userId === creatorId || d._id === creatorId));
        if (user) {
          name = name || user.name || '';
          role = role || user.role || '';
        }
      }

      // Check currentUser if createdBy matches current user id
      if ((!name || !role) && currentUser && (creatorId === currentUser.userId || creatorId === currentUser._id)) {
        name = name || currentUser.name || '';
        role = role || currentUser.role || '';
      }

      name = name || 'Team Member';
      role = (role || 'member').toLowerCase();

      let badgeClass = 'badge-member';
      if (role === 'superadmin') {
        badgeClass = 'badge-superadmin';
      } else if (role === 'admin') {
        badgeClass = 'badge-admin';
      }

      return `<span class="inline-flex items-center gap-1.5"><span class="font-semibold text-slate-800">${escapeHtml(name)}</span> <span class="badge ${badgeClass}">${role.toUpperCase()}</span></span>`;
    }

    function getPlatformBadge(platform) {
      platform = platform || 'Online';
      let badgeClass = 'badge-online';
      if (platform === 'Physical Meeting') {
        badgeClass = 'badge-physical';
      } else if (platform.toLowerCase().includes('zoom')) {
        badgeClass = 'badge-low';
      }
      return `<span class="badge ${badgeClass}">${escapeHtml(platform)}</span>`;
    }

    function renderMeetingJoinButton(m) {
      if (!m.link) return '<span class="text-xs text-slate-400 italic">No link provided</span>';
      const rawLink = String(m.link || '').trim();
      const isSafeUrl = /^https?:\/\//i.test(rawLink);
      if (!isSafeUrl) {
        return `<span class="text-xs text-slate-400 italic" title="${escapeHtml(rawLink)}">Invalid link</span>`;
      }
      const meetingTime = new Date(m.dateTime).getTime();
      const isExpired = Date.now() > meetingTime + (15 * 60 * 1000);
      if (isExpired) {
        return `<button class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-400 border border-slate-200 px-3.5 py-1.5 rounded-lg text-xs font-semibold cursor-not-allowed" disabled>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Meeting Expired
        </button>`;
      }
      const safeLink = safeUrl(rawLink);
      return `<a href="${safeLink}" onclick="return handleMeetingLinkClick(event, this.getAttribute('href'), '${escapeHtml(m.dateTime)}')" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 btn-primary text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm hover:shadow transition-all">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        Join Meeting
      </a>`;
    }

    function renderMeetingsPage(config) {
      const textColor = config.text_color || defaultConfig.text_color;

      let meetings = [];
      let pageTitle = 'All Meetings';

      if (currentUser?.role === 'superadmin') {
        meetings = allData.filter(d => d.type === 'meeting');
        pageTitle = 'All Meetings';
      } else if (currentUser?.role === 'admin') {
        meetings = allData.filter(d =>
          d.type === 'meeting' &&
          (d.createdBy === currentUser.userId || d.attendees?.includes(currentUser.userId))
        );
        pageTitle = 'Team & Admin Meetings';
      } else {
        meetings = allData.filter(d =>
          d.type === 'meeting' &&
          (d.attendees?.includes(currentUser.userId) || d.createdBy === currentUser.userId)
        );
        pageTitle = 'My Meetings';
      }

      // Keep meetings for 30 minutes after start time (15m active + 15m expired view) and sort newest-first
      meetings = meetings.filter(m => new Date(m.dateTime).getTime() + (30 * 60 * 1000) >= Date.now());
      meetings.sort((a, b) => new Date(b.dateTime) - new Date(a.dateTime));

      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">

              Add Meeting
            </button>
          </div>
          
          <div class="space-y-3">
            ${meetings.length > 0 ? meetings.map(m => `
              <div class="card p-5 hover:shadow-md transition-shadow">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3 mb-3">
                  <div class="space-y-1.5 flex-1">
                    <div class="flex items-center gap-2.5 flex-wrap">
                      <h3 class="text-base font-bold text-slate-800">${escapeHtml(m.title)}</h3>
                      ${getPlatformBadge(m.platform)}
                    </div>
                    ${m.description ? `<p class="text-sm text-slate-600">${escapeHtml(m.description)}</p>` : ''}
                    <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-xs text-slate-500 pt-1">
                      <span class="inline-flex items-center gap-1.5">
                        <span class="text-slate-400">📅</span>
                        <span class="text-slate-700 font-medium">Date: ${new Date(m.dateTime).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</span>
                      </span>
                      <span class="inline-flex items-center gap-1.5">
                        <span class="text-slate-400">👥</span>
                        <span class="text-slate-700 font-medium">Attendees: ${m.attendees ? m.attendees.split(',').filter(Boolean).length : 0}</span>
                      </span>
                      <span class="inline-flex items-center gap-1.5">
                        <span class="text-slate-400">👤</span>
                        <span class="text-slate-700 font-medium">Created by:</span> ${formatCreator(m)}
                      </span>
                    </div>
                  </div>
                </div>
                <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                  ${renderMeetingJoinButton(m)}

      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');

      const password = document.getElementById('register-password').value.trim();

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const errorDiv = document.getElementById('login-error');

      if (!email || !password) {
        errorDiv.textContent = 'Please fill in all fields';
        errorDiv.classList.remove('hidden');
        return;
      }

      try {
        const res = await apiFetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          authToken = data.token;
          localStorage.setItem('authToken', authToken);
          currentUser = normalizeCurrentUser(data.user);
          localStorage.setItem('currentUser', JSON.stringify(currentUser));
          if (socket && typeof socket.connect === 'function') {
            socket.auth = { token: authToken };
            if (!socket.connected) socket.connect();
          }
          socket.emit('join', currentUser.userId);
          navigateTo('dashboard');
          // Load this user's data right away (previously only appeared after a refresh)
          window.dataSdk._cachedUsers = null;
          window.dataSdk.loadData({ forceUsers: true, force: true });
        } else {
          errorDiv.textContent = data.message;
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = 'Login failed';
        errorDiv.classList.remove('hidden');
      }
    }

    function handleLogout() {
      currentUser = null;
      authToken = null;
      localStorage.removeItem('currentUser');
      localStorage.removeItem('authToken');
      if (socket && typeof socket.disconnect === 'function') {
        socket.disconnect();
      }
      // Drop every piece of the previous user's data from memory
      allData = [];
      if (window.dataSdk) {
        window.dataSdk.data = [];
        window.dataSdk._cachedUsers = null;
      }
      navigateTo('login');
      window.location.reload();
    }

    function renderNotificationsList(tab = 'all') {
      const container = document.getElementById('notifications-list');
      const countPill = document.getElementById('notif-modal-count');
      if (!container) return;

      const myNotifications = allData.filter(d => {
        if (d.type !== 'notification') return false;
        if (!d.recipients || d.recipients.length === 0) return true;
        return d.recipients.some(r => String(r._id || r.userId || r) === String(currentUser?.userId));
      });

      const unreadCount = myNotifications.filter(n => {
        if (!n.isRead || !Array.isArray(n.isRead)) return true;
        return !n.isRead.some(r => String(r.user?._id || r.user || '') === String(currentUser?.userId));
      }).length;

      if (countPill) {
        countPill.textContent = unreadCount > 0 ? `${unreadCount} Unread` : 'All Read';
      }

      let filtered = myNotifications;
      if (tab !== 'all') {
        filtered = myNotifications.filter(n => (n.notifType || n.type) === tab);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400">
            <div class="text-2xl mb-1.5">🔔</div>
            <p class="text-xs font-medium">No notifications in this category.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(n => {
        const isRead = n.isRead && Array.isArray(n.isRead) && n.isRead.some(r => String(r.user?._id || r.user || '') === String(currentUser?.userId));
        const notifType = n.notifType || 'broadcast';

        let badge = { icon: '📢', label: 'Announcement', style: 'bg-purple-100 text-purple-800' };
        let emailBanner = '';

        if (notifType === 'work') {
          badge = { icon: '📋', label: 'Task', style: 'bg-amber-100 text-amber-900' };
          emailBanner = `<div class="mt-1 flex items-center gap-1 text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200/70 w-fit">✉️ Email sent for task allocation</div>`;
        } else if (notifType === 'meeting') {

          emailBanner = `<div class="mt-1 flex items-center gap-1 text-[11px] font-semibold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200/70 w-fit">✉️ Email sent with meeting details</div>`;
        } else if (notifType === 'leave') {
          badge = { icon: '🌴', label: 'Leave', style: 'bg-emerald-100 text-emerald-800' };
        }

        const senderName = n.sentBy?.name || (typeof n.sentBy === 'string' ? '' : '');
        const timeAgo = n.createdAt ? new Date(n.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
        const notifId = n._id || n.__backendId;

        return `
          <div class="p-3 rounded-xl border transition-all ${isRead ? 'bg-white border-slate-200' : 'bg-indigo-50/40 border-indigo-200 shadow-2xs'}">
            <div class="flex items-start justify-between gap-2 mb-1">
              <div class="flex items-center gap-1.5 flex-wrap">

                  ${badge.icon} ${badge.label}

                <span class="text-xs font-bold text-slate-800">${escapeHtml(n.title || 'Notification')}</span>
              </div>
              <div class="flex items-center gap-1">
                ${!isRead ? `<span class="h-2 w-2 rounded-full bg-indigo-600 inline-block" title="Unread"></span>` : ''}

                  <button onclick="markNotificationAsRead('${escapeHtml(String(notifId))}')" class="text-[10px] font-medium text-slate-400 hover:text-indigo-600 transition-colors ml-1" title="Mark as Read">

    async function updateProfile(event) {
      event.preventDefault();
      const name = document.getElementById('profile-name')?.value.trim();
      const email = document.getElementById('profile-email')?.value.trim();
      const mobile = document.getElementById('profile-mobile')?.value.trim();
      const password = document.getElementById('profile-password')?.value;
      const confirmPassword = document.getElementById('profile-confirm-password')?.value;
      const currentPassword = document.getElementById('profile-current-password')?.value || '';
      const errorDiv = document.getElementById('profile-error');
      const successDiv = document.getElementById('profile-success');
      const submitBtn = document.getElementById('profile-submit-btn');

      if (errorDiv) {
        errorDiv.classList.add('hidden');
        errorDiv.textContent = '';
      }
      if (successDiv) {
        successDiv.classList.add('hidden');
        successDiv.textContent = '';
      }

      if (!name || !email || !mobile) {
        if (errorDiv) {
          errorDiv.textContent = 'Please fill in Name, Email, and Mobile fields.';
          errorDiv.classList.remove('hidden');
        }
        return;
      }

      if (password) {
        if (password.length < 8) {
          if (errorDiv) {
            errorDiv.textContent = 'New password must be at least 8 characters.';
            errorDiv.classList.remove('hidden');
          }
          return;
        }
        if (password !== confirmPassword) {
          if (errorDiv) {
            errorDiv.textContent = 'New password and confirm password do not match.';
            errorDiv.classList.remove('hidden');
          }
          return;
        }
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';
      }

      try {
        const payload = { name, email, mobile };
        if (password) payload.password = password;
        if (currentPassword) payload.currentPassword = currentPassword;

        const res = await apiFetch(`${API_BASE}/auth/profile`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          if (data.token) {
            // Password changed: the server revoked old sessions and issued a new token
            authToken = data.token;
            localStorage.setItem('authToken', authToken);
            if (socket && typeof socket.connect === 'function') {
              socket.auth = { token: authToken };
              if (socket.connected) socket.disconnect();
              socket.connect();
            }
          }
          const { token: _ignoredToken, ...profileData } = data;
          currentUser = normalizeCurrentUser(profileData);
          localStorage.setItem('currentUser', JSON.stringify(currentUser));
          if (successDiv) {
            successDiv.textContent = 'Profile updated successfully!';
            successDiv.classList.remove('hidden');
          } else {
            alert('Profile updated successfully!');
          }
          const pwdElem = document.getElementById('profile-password');
          const cpwdElem = document.getElementById('profile-confirm-password');
          const curElem = document.getElementById('profile-current-password');
          if (pwdElem) pwdElem.value = '';
          if (cpwdElem) cpwdElem.value = '';
          if (curElem) curElem.value = '';
          // Refresh users and re-render header/pages
          await window.dataSdk.loadData({ forceUsers: true });
        } else {
          if (errorDiv) {
            errorDiv.textContent = data.message || 'Failed to update profile.';
            errorDiv.classList.remove('hidden');
          }
        }
      } catch (err) {
        if (errorDiv) {
          errorDiv.textContent = 'Update failed. Please check your connection.';
          errorDiv.classList.remove('hidden');
        }
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save Changes';
        }
      }
    }

          } else if (department) {
            const adminWithDept = allData.find(d => d.type === 'user' && d.role === 'admin' && d.department === department);
            if (adminWithDept) {
              payload.assignedAdmin = adminWithDept._id || adminWithDept.userId;
            } else {
              payload.assignedAdmin = null;
            }
          }
        }
      }

      if (password && password.trim().length > 0) {
        payload.password = password;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';
      }

      try {
        const res = await apiFetch(`${API_BASE}/users/${userId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          if (currentUser?.role === 'superadmin' && role === 'admin' && department) {
            await updateAllMembersInDepartment(department, userId);
          }

          if (String(currentUser?.userId) === String(userId)) {
            if (data.token) {
              authToken = data.token;
              localStorage.setItem('authToken', authToken);
              if (socket && typeof socket.connect === 'function') {
                socket.auth = { token: authToken };
                if (socket.connected) socket.disconnect();
                socket.connect();
              }
            }
            const { token: _ignoredToken, ...userData } = data;
            currentUser = normalizeCurrentUser({ ...currentUser, ...userData });
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
          }

          alert('User updated successfully!');
          event.target.closest('.modal-backdrop').remove();
          await window.dataSdk.loadData({ forceUsers: true });
        } else {
          if (errorDiv) {
            errorDiv.textContent = data.message || 'Failed to update user.';
            errorDiv.classList.remove('hidden');
          } else {
            alert(data.message || 'Failed to update user');
          }
        }
      } catch (err) {
        if (errorDiv) {
          errorDiv.textContent = 'Error updating user. Please check your connection.';
          errorDiv.classList.remove('hidden');
        } else {
          alert('Error updating user');
        }
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save Changes';
        }
      }
    }


    async function updateAllMembersInDepartment(department, adminId) {
      // Find all members in this department
      const membersInDept = allData.filter(d =>
        d.type === 'user' &&
        d.role === 'member' &&
        d.department === department &&
        d._id !== adminId // Don't update the admin themselves
      );

      // Update each member to be assigned to this admin
      for (const member of membersInDept) {
        try {
          await apiFetch(`${API_BASE}/users/${member._id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
            body: JSON.stringify({ assignedAdmin: adminId })
          });
        } catch (err) {
          console.error(`Failed to update member ${member._id}:`, err);
        }
      }
    }

    function toggleSelectAll(listId, selectAllBtnId, countId) {
      const list = document.getElementById(listId);
      if (!list) return;
      const checkboxes = Array.from(list.querySelectorAll('input[type="checkbox"]:not(:disabled)'));
      if (checkboxes.length === 0) return;
      const allChecked = checkboxes.every(cb => cb.checked);
      checkboxes.forEach(cb => {
        cb.checked = !allChecked;
        updateCheckboxRowStyle(cb);
      });
      updateChecklistCount(listId, selectAllBtnId, countId);
    }

    function updateChecklistCount(listId, selectAllBtnId, countId) {
      const list = document.getElementById(listId);
      if (!list) return;
      const checkboxes = Array.from(list.querySelectorAll('input[type="checkbox"]:not(:disabled)'));
      const checked = checkboxes.filter(cb => cb.checked);
      const countEl = document.getElementById(countId);
      if (countEl) countEl.textContent = checked.length;

    function showWorkDetails(dateStr) {
      const workItems = allData.filter(d => d.type === 'workItem');
      const users = allData.filter(d => d.type === 'user');

      const parts = (dateStr || '').split('-').map(Number);
      const ty = parts[0], tm = parts[1], td = parts[2];

      const deadlineTasks = workItems.filter(w => {
        if (!w.deadline) return false;
        const dt = new Date(w.deadline);
        if (isNaN(dt.getTime())) return false;
        return dt.getFullYear() === ty && (dt.getMonth() + 1) === tm && dt.getDate() === td;
      });

      if (deadlineTasks.length === 0) return;

      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50';
      modal.innerHTML = `
        <div class="card p-6 max-w-full sm:max-w-4xl w-full max-h-screen overflow-y-auto">
          <h3 class="text-xl font-bold mb-4">Work Items Due on ${new Date(ty, tm - 1, td).toLocaleDateString()}</h3>
          <div class="space-y-4">
            ${deadlineTasks.map(task => {
              const assignedNames = (task.assignedTo || []).map(u => {
                if (typeof u === 'object' && u?.name) return u.name;
                const uid = String(u?._id || u?.id || u);
                const found = users.find(usr => String(usr.userId || usr._id || usr.id) === uid);
                return found?.name || 'Staff';
              }).join(', ') || 'Unassigned';

              const assignedByName = (typeof task.assignedBy === 'object' && task.assignedBy?.name)
                ? task.assignedBy.name
                : (users.find(usr => String(usr.userId || usr._id || usr.id) === String(task.assignedBy))?.name || 'Super Admin');

              return `
                <div class="border rounded-lg p-4">
                  <div class="flex justify-between items-start mb-2">
                    <h4 class="font-semibold text-lg">${escapeHtml(task.title)}</h4>
                    <span class="badge badge-${task.priority?.toLowerCase() || 'medium'}">${task.priority || 'Medium'}</span>

                    <div>
                      <strong>Status:</strong> ${task.status?.replace('_', ' ').toUpperCase() || 'ASSIGNED'}
                    </div>
                    <div>
                      <strong>Progress:</strong> ${task.progress || 0}%
                    </div>
                    <div>
                      <strong>Assigned To:</strong> ${escapeHtml(assignedNames)}
                    </div>
                    <div>
                      <strong>Assigned By:</strong> ${escapeHtml(assignedByName)}
                    </div>
                    <div>
                      <strong>Created:</strong> ${task.createdAt ? new Date(task.createdAt).toLocaleDateString() : 'Unknown'}
                    </div>
                    <div>
                      <strong>Deadline:</strong> ${task.deadline ? new Date(task.deadline).toLocaleDateString() : 'No deadline'}

                    <div class="mt-3">

                          <div class="text-xs bg-gray-50 p-2 rounded">
                            <strong>${escapeHtml(note.user?.name || 'Unknown')}:</strong> ${escapeHtml(note.note)} (${note.progress}%)
                            <span class="text-gray-500">${new Date(note.date).toLocaleDateString()}</span>

          </div>
        </div>
      `;
      document.body.appendChild(modal);

    async function handleCreateWorkItem() {
      if (allData.filter(d => d.type === 'workItem').length >= 999) {
        showNotification('Maximum limit of 999 work items reached. Please complete or delete some items first.', 'error');
        return;
      }

      const title = document.getElementById('work-title').value.trim();
      const description = document.getElementById('work-description').value.trim();
      const deadline = document.getElementById('work-deadline').value;
      const priority = document.getElementById('work-priority').value;
      const checkedBoxes = document.querySelectorAll('#work-members-list input[type="checkbox"]:checked');
      let selectedAssignees = Array.from(checkedBoxes).map(cb => cb.value);
      if (selectedAssignees.length === 0) {
        const assigneesSelect = document.getElementById('work-assignees');
        if (assigneesSelect && assigneesSelect.selectedOptions) {
          selectedAssignees = Array.from(assigneesSelect.selectedOptions).map(option => option.value);
        }
      }

      // Validate required fields
      if (!title || !description || selectedAssignees.length === 0) {
        showNotification('Please fill in all required fields: title, description, and select at least one team member', 'error');
        return;
      }

      const workData = {
        title,
        description,
        assignedTo: selectedAssignees,
        priority,
        deadline: deadline ? new Date(deadline).toISOString() : null,
        driveLink: document.getElementById('work-drive-link')?.value.trim() || ''
      };

      try {
        const res = await apiFetch(`${API_BASE}/works`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify(workData)
        });

        if (res.ok) {
          const newWork = await res.json();
          // Add to local data
          allData.push({
            ...newWork,
            type: 'workItem',
            __backendId: newWork._id
          });

          document.querySelector('.modal-backdrop')?.remove();
          showNotification('Work item created successfully!', 'success');

          // Refresh data
          window.dataSdk.loadData();
        } else {
          const error = await res.json();
          showNotification(error.message || 'Failed to create work item', 'error');
        }
      } catch (err) {
        showNotification('Error creating work item', 'error');
      }
    }

    async function acceptWork(workId) {
      const item = allData.find(d => (d.__backendId === workId || d._id === workId));
      const prevStatus = item ? item.status : 'assigned';
      if (item) {
        item.status = 'accepted';
        renderCurrentPage();
      }
      showNotification('Work accepted successfully!', 'success');

      try {
        const res = await apiFetch(`${API_BASE}/works/${workId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify({ status: 'accepted' })
        });

        if (res.ok) {
          const updated = await res.json();
          if (item) {
            Object.assign(item, updated, { type: 'workItem', __backendId: updated._id });
          }
          window.dataSdk.loadData();
        } else {
          if (item) {
            item.status = prevStatus;
            renderCurrentPage();
          }
          const error = await res.json();
          showNotification(error.message || 'Failed to accept work', 'error');
        }
      } catch (err) {
        if (item) {
          item.status = prevStatus;
          renderCurrentPage();
        }
        showNotification('Error accepting work', 'error');
      }
    }

    async function updateWorkProgress(workId) {
      const progressInput = document.getElementById(`progress-${workId}`);
      const noteInput = document.getElementById(`progress-note-${workId}`);
      const driveInput = document.getElementById(`progress-drive-${workId}`);
      const progress = progressInput ? progressInput.value : '0';
      const note = noteInput ? noteInput.value.trim() : '';
      const driveLink = driveInput ? driveInput.value.trim() : '';

      if (!note) {
        showNotification('Please provide a progress note', 'error');
        return;
      }

      const item = allData.find(d => (d.__backendId === workId || d._id === workId));

      // If user marks progress as 100% and has not provided a drive link, open complete modal
      if (progress === '100' && !driveLink && (!item || !item.driveLink)) {
        showCompleteWorkModal(workId);
        return;
      }

      const status = progress === '100' ? 'completed' : 'in_progress';
      const prevProgress = item ? item.progress : 0;
      const prevStatus = item ? item.status : 'assigned';
      const prevDrive = item ? item.driveLink : '';

      // Instant optimistic update
      if (item) {
        item.progress = parseInt(progress);
        item.status = status;
        if (driveLink) item.driveLink = driveLink;
        if (!item.notes) item.notes = [];
        item.notes.push({
          user: currentUser,
          note: driveLink ? `${note} (Drive files: ${driveLink})` : note,
          progress: parseInt(progress),
          date: new Date().toISOString()
        });
        renderCurrentPage();
      }
      showNotification(`Progress updated to ${progress}%!`, 'success');
      if (noteInput) noteInput.value = '';

      try {
        const payload = {
          status,
          progress: parseInt(progress),
          note
        };
        if (driveLink) {
          payload.driveLink = driveLink;
        } else if (item && item.driveLink) {
          payload.driveLink = item.driveLink;
        }

        const res = await apiFetch(`${API_BASE}/works/${workId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const updated = await res.json();
          if (item) {
            Object.assign(item, updated, { type: 'workItem', __backendId: updated._id });
          }
          window.dataSdk.loadData();
        } else {
          if (item) {
            item.progress = prevProgress;
            item.status = prevStatus;
            item.driveLink = prevDrive;
            renderCurrentPage();
          }
          const error = await res.json();
          showNotification(error.message || 'Failed to update progress', 'error');
        }
      } catch (err) {
        if (item) {
          item.progress = prevProgress;
          item.status = prevStatus;
          item.driveLink = prevDrive;
          renderCurrentPage();
        }
        showNotification('Error updating progress', 'error');
      }
    }

    async function submitTransferWork(workItemId) {
      const list = document.getElementById('transfer-members-list');
      if (!list) return;

      const checkedBoxes = Array.from(list.querySelectorAll('input[type="checkbox"]:checked'));
      const selectedMemberIds = checkedBoxes.map(cb => cb.value);

      if (selectedMemberIds.length === 0) {
        showNotification('Please select at least one member to transfer work to', 'error');
        return;
      }

      const keepAdminAssigned = document.getElementById('transfer-keep-admin')?.checked || false;
      const transferNote = document.getElementById('transfer-note')?.value.trim() || '';

      // Instant optimistic close and visual confirmation
      document.querySelector('.modal-backdrop')?.remove();
      showNotification('Work transferred to team member(s)!', 'success');

      try {
        const res = await apiFetch(`${API_BASE}/works/${workItemId}/transfer`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify({
            assignedTo: selectedMemberIds,
            transferNote,
            keepAdminAssigned
          })
        });

        if (res.ok) {
          const updated = await res.json();
          const item = allData.find(d => (d.__backendId === workItemId || d._id === workItemId));
          if (item) {
            Object.assign(item, updated, { type: 'workItem', __backendId: updated._id });
            renderCurrentPage();
          }
          window.dataSdk.loadData();
        } else {
          const err = await res.json();
          showNotification(err.message || 'Failed to transfer work', 'error');
          window.dataSdk.loadData();
        }
      } catch (e) {
        console.error('Error transferring work:', e);
        showNotification('Network error while transferring work', 'error');
        window.dataSdk.loadData();
      }
    }

    async function handleModalUpdateProgress(workItemId) {
      const progressEl = document.getElementById(`modal-progress-${workItemId}`);
      const noteEl = document.getElementById(`modal-note-${workItemId}`);
      const driveEl = document.getElementById(`modal-drive-${workItemId}`);
      const progress = progressEl ? progressEl.value : '0';
      const note = noteEl ? noteEl.value.trim() : '';
      const driveLink = driveEl ? driveEl.value.trim() : '';

      if (!note) {
        showNotification('Please enter a note describing your progress', 'error');
        return;
      }

      const item = allData.find(d => (d.__backendId === workItemId || d._id === workItemId));

      // If user marks progress as 100% and has not provided a drive link, open complete modal
      if (progress === '100' && !driveLink && (!item || !item.driveLink)) {
        showCompleteWorkModal(workItemId);
        return;
      }

      const status = progress === '100' ? 'completed' : 'in_progress';
      const prevProgress = item ? item.progress : 0;
      const prevStatus = item ? item.status : 'assigned';
      const prevDrive = item ? item.driveLink : '';

      // Instant optimistic update & close modal
      if (item) {
        item.progress = parseInt(progress);
        item.status = status;
        if (driveLink) item.driveLink = driveLink;
        if (!item.notes) item.notes = [];
        item.notes.push({
          user: currentUser,
          note: driveLink ? `${note} (Drive files: ${driveLink})` : note,
          progress: parseInt(progress),
          date: new Date().toISOString()
        });
        renderCurrentPage();
      }
      document.querySelector('.modal-backdrop')?.remove();
      showNotification(`Progress updated to ${progress}%!`, 'success');

      try {
        const payload = {
          status,
          progress: parseInt(progress),
          note
        };
        if (driveLink) {
          payload.driveLink = driveLink;
        } else if (item && item.driveLink) {
          payload.driveLink = item.driveLink;
        }

        const res = await apiFetch(`${API_BASE}/works/${workItemId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const updated = await res.json();
          if (item) {
            Object.assign(item, updated, { type: 'workItem', __backendId: updated._id });
          }
          window.dataSdk.loadData();
        } else {
          if (item) {
            item.progress = prevProgress;
            item.status = prevStatus;
            item.driveLink = prevDrive;
            renderCurrentPage();
          }
          const error = await res.json();
          showNotification(error.message || 'Failed to update progress', 'error');
        }
      } catch (err) {
        if (item) {
          item.progress = prevProgress;
          item.status = prevStatus;
          item.driveLink = prevDrive;
          renderCurrentPage();
        }
        showNotification('Error updating progress', 'error');
      }
    }

    window.submitCompleteWork = async function(event, workId) {
      if (event) event.preventDefault();
      const driveInput = document.getElementById(`complete-drive-link-${workId}`);
      const noteInput = document.getElementById(`complete-note-${workId}`);
      const driveLink = driveInput ? driveInput.value.trim() : '';
      const note = (noteInput ? noteInput.value.trim() : '') || 'Work marked as completed with files submitted to Drive.';

      if (!driveLink) {
        showNotification('Please enter the Drive link where work files are stored', 'error');
        return;
      }

      const item = allData.find(d => (d.__backendId === workId || d._id === workId));
      const prevStatus = item ? item.status : 'in_progress';
      const prevProgress = item ? item.progress : 0;
      const prevDrive = item ? item.driveLink : '';

      // Instant optimistic update
      if (item) {
        item.status = 'completed';
        item.progress = 100;
        item.driveLink = driveLink;
        if (!item.notes) item.notes = [];
        item.notes.push({
          user: currentUser,
          note: `${note} (Drive files: ${driveLink})`,
          progress: 100,
          date: new Date().toISOString()
        });
        renderCurrentPage();
      }

      document.querySelector('.modal-backdrop')?.remove();
      showNotification('Work completed and Drive link submitted successfully!', 'success');

      try {
        const res = await apiFetch(`${API_BASE}/works/${workId}/status`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify({
            status: 'completed',
            progress: 100,
            note,
            driveLink
          })
        });

        if (res.ok) {
          const updated = await res.json();
          if (item) {
            Object.assign(item, updated, { type: 'workItem', __backendId: updated._id });
          }
          window.dataSdk.loadData();
        } else {
          if (item) {
            item.status = prevStatus;
            item.progress = prevProgress;
            item.driveLink = prevDrive;
            renderCurrentPage();
          }
          const error = await res.json();
          showNotification(error.message || 'Failed to complete work', 'error');
        }
      } catch (err) {
        if (item) {
          item.status = prevStatus;
          item.progress = prevProgress;
          item.driveLink = prevDrive;
          renderCurrentPage();
        }
        showNotification('Error completing work', 'error');
      }
    };

    async function handleCreateMeeting() {
      const button = document.querySelector('#meeting-modal button:last-child');
      button.disabled = true;
      button.textContent = 'Scheduling...';

      if (allData.filter(d => d.type === 'meeting').length >= 999) {
        showNotification('Maximum limit of 999 meetings reached.', 'error');
        button.disabled = false;
        button.textContent = 'Schedule Meeting';
        return;
      }

      const title = document.getElementById('meeting-title').value.trim();
      const description = document.getElementById('meeting-description').value.trim();
      const dateTime = document.getElementById('meeting-datetime').value;
      const platform = document.getElementById('meeting-platform').value;
      const checkedBoxes = document.querySelectorAll('#meeting-members-list input[type="checkbox"]:checked');
      let selectedAttendees = Array.from(checkedBoxes).map(cb => cb.value);
      if (selectedAttendees.length === 0) {
        const attendeesSelect = document.getElementById('meeting-attendees');
        if (attendeesSelect && attendeesSelect.selectedOptions) {
          selectedAttendees = Array.from(attendeesSelect.selectedOptions).map(option => option.value);
        }
      }
      const link = document.getElementById('meeting-link').value.trim();

      if (!title || !description || !dateTime || selectedAttendees.length === 0) {
        showNotification('Please fill in all required fields and select at least one attendee', 'error');
        button.disabled = false;
        button.textContent = 'Schedule Meeting';
        return;
      }

      const meeting = {
        type: 'meeting',
        meetingId: `meeting_${Date.now()}`,
        title,
        description,
        dateTime: new Date(dateTime).toISOString(),
        platform,
        attendees: selectedAttendees.join(','),
        link: link || '',
        createdBy: currentUser.userId,
        createdByName: currentUser.name,
        createdByRole: currentUser.role,
        timestamp: new Date().toISOString()
      };

      const result = await window.dataSdk.create(meeting);

      if (result.isOk) {
        document.getElementById('meeting-modal').remove();
        showNotification('Meeting scheduled successfully!', 'success');
      } else {
        showNotification(escapeHtml(result.error || 'Failed to schedule meeting'), 'error');
        button.disabled = false;
        button.textContent = 'Schedule Meeting';
      }
    }

    async function handleBroadcast() {
      const title = document.getElementById('announcement-title')?.value.trim();
      const text = document.getElementById('announcement-text')?.value.trim();
      const audience = document.getElementById('announcement-audience')?.value;
      const errorDiv = document.getElementById('announcement-error');
      const submitBtn = document.getElementById('broadcast-submit-btn');

      if (errorDiv) {
        errorDiv.classList.add('hidden');
        errorDiv.textContent = '';
      }

      if (!text) {
        if (errorDiv) {
          errorDiv.textContent = 'Please enter an announcement message.';
          errorDiv.classList.remove('hidden');
        } else {
          showNotification('Please enter announcement message', 'error');
        }
        return;
      }

      let recipients = [];
      if (audience === 'team') {
        const teamUsers = allData.filter(d => d.type === 'user' && d.role === 'member' && String(d.assignedAdmin) === String(currentUser?.userId));
        recipients = teamUsers.map(u => u._id || u.userId);
      } else if (audience && audience.startsWith('dept:')) {
        const dept = audience.replace('dept:', '');
        const deptUsers = allData.filter(d => d.type === 'user' && d.department === dept);
        recipients = deptUsers.map(u => u._id || u.userId);
      } // else 'all' -> recipients is [] (broadcast to all)

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Broadcasting...';
      }

      try {
        const res = await apiFetch(`${API_BASE}/notifications/broadcast`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          },
          body: JSON.stringify({
            title: title || 'Company Announcement',
            message: text,
            recipients
          })
        });

        const data = await res.json();
        if (res.ok) {
          document.querySelector('.modal-backdrop')?.remove();
          showNotification('📢 Announcement broadcasted successfully via in-app notification and email!', 'success');
          await window.dataSdk.loadData();
        } else {
          if (errorDiv) {
            errorDiv.textContent = data.message || 'Failed to broadcast announcement.';
            errorDiv.classList.remove('hidden');
          } else {
            showNotification(data.message || 'Failed to broadcast announcement', 'error');
          }
        }
      } catch (err) {
        if (errorDiv) {
          errorDiv.textContent = 'Network or server error broadcasting announcement.';
          errorDiv.classList.remove('hidden');
        } else {
          showNotification('Error broadcasting announcement', 'error');
        }
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Send Broadcast';
        }
      }
    }


    async function handleCheckIn() {
      const now = new Date().toISOString();
      const today = now.split('T')[0];
      const tempId = 'temp_checkin_' + Date.now();
      const optimisticAttendance = {
        type: 'attendance',
        userId: currentUser.userId,
        username: currentUser.name,
        user: currentUser,
        checkInTime: now,
        checkOutTime: null,
        date: today,
        _id: tempId,
        __backendId: tempId
      };
      allData.push(optimisticAttendance);
      renderCurrentPage();
      showNotification('Checked in successfully!', 'success');

      try {
        const res = await apiFetch(`${API_BASE}/attendance/checkin`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`
          }
        });

        if (res.ok) {
          const attendance = await res.json();
          const idx = allData.findIndex(d => d._id === tempId);
          if (idx !== -1) {
            allData[idx] = {
              type: 'attendance',
              userId: currentUser.userId,
              username: currentUser.name,
              user: currentUser,
              checkInTime: attendance.checkIn,
              checkOutTime: attendance.checkOut || null,
              date: attendance.date,
              _id: attendance._id,
              __backendId: attendance._id
            };
          }
        } else {
          allData = allData.filter(d => d._id !== tempId);
          renderCurrentPage();
          showNotification('Failed to check in', 'error');
        }
      } catch (err) {
        allData = allData.filter(d => d._id !== tempId);
        renderCurrentPage();
        showNotification('Error checking in', 'error');
      }
    }
